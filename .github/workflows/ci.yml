name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 质量门禁：本地 npm run check 跑什么，这里就跑什么，一条都不少。
  # 门禁不过，下面的部署 job 连启动的机会都没有。
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    # 实测整条门禁在 ubuntu-latest 上约 2 分钟；20 分钟纯属防卡死的兜底。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quality gate (lint + assets + data + unit + build + e2e)
        run: npm run check

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 边缘部署：只在 main 上跑，且必须等门禁绿。
  # Cloudflare Pages 本体由它自己的 Git 集成部署（wrangler.toml 里的
  # pages_build_output_dir 已经声明），这里只补它管不到的两件事：
  #   D1 迁移 和 Durable Object worker（kkhome-party-rooms）
  # 两边都碰 D1/R2/DO，所以绝不能重复部署 Pages，避免双写。
  deploy-edge:
    name: Deploy edge (D1 migrations + party-rooms worker)
    needs: quality-gate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 缺凭证就直接红，并说清去哪儿配 —— 不许静默跳过，
      # 否则会退化成「推了但线上没变」那种最难查的假故障。
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID。"
            echo "::error::请到仓库 Settings → Secrets and variables → Actions 添加这两个 secret。"
            exit 1
          fi
          npx wrangler whoami

      # 先打印待应用的迁移，日志里能直接看到这次到底动了什么。
      - name: Show pending D1 migrations
        run: npx wrangler d1 migrations list kkhome_wishes --remote

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply kkhome_wishes --remote

      - name: Deploy party-rooms worker
        run: npx wrangler deploy --config workers/party-rooms/wrangler.toml
