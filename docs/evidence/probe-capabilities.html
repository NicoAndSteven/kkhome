<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>anime.js 4.5 — consolidated capability probe</title>
<style>
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
  .case { padding: 8px 14px; border-bottom: 1px solid #21262d; }
  .case h3 { margin: 0 0 5px; font-size: 12px; color: #8b949e; }
  #row { display: flex; gap: 8px; }
  .box { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 6px; background: #1f6feb; color: #fff; font-weight: 600; }
  .bar { width: 8px; background: #3fb950; border-radius: 3px; display: inline-block; }
  .stage { position: relative; min-height: 70px; }
</style>
</head>
<body>
<script src="./anime.umd.js"></script>

<div class="case"><h3>1 splitText</h3><div id="split">深空摄影棚 Signal Bloom</div></div>
<div class="case"><h3>2 createLayout</h3><div id="row"><div class="box">A</div><div class="box">B</div><div class="box">C</div><div class="box">D</div></div></div>
<div class="case"><h3>3 morphTo</h3><svg width="130" height="90" viewBox="0 0 130 90">
  <path id="srcPath" d="M10,45 L120,45 L120,65 L10,65 Z" fill="#a371f7" /><path id="dstPath" d="M65,10 L115,80 L15,80 Z" fill="none" /></svg></div>
<div class="case"><h3>4 createDrawable</h3><svg width="140" height="40"><path id="d1" d="M5,20 C35,0 65,40 135,20" stroke="#f0883e" stroke-width="3" fill="none" /></svg></div>
<div class="case"><h3>5 createAnimatable</h3><div id="amt" class="box">A</div></div>
<div class="case"><h3>6 createDraggable</h3><div class="stage" id="dragStage" style="height:120px;border:1px dashed #30363d;border-radius:8px">
  <div id="drag" class="box" style="position:absolute;left:8px;top:30px;cursor:grab">drag</div></div></div>
<div class="case"><h3>7 scrambleText</h3><div id="scr">FINAL TEXT</div></div>
<div class="case"><h3>8 spring</h3><div id="spr" class="box">S</div></div>
<div class="case"><h3>9 stagger grid/from</h3><div class="stage" id="stg"></div></div>
<div class="case"><h3>10 onScroll</h3><div id="scrollbox" class="box">SC</div><div style="height:120vh"></div></div>
<div class="case"><h3>11 waapi</h3><div id="wbox" class="box">W</div></div>
<div class="case"><h3>12 utils</h3><div id="utilout"></div></div>
<div class="case"><h3>13 splitText + stagger（逐字）</h3><div id="splitAnim">CODE THE RUSH</div></div>
<div class="case"><h3>14 createMotionPath</h3><svg width="160" height="90">
  <path id="mp" d="M10,70 C40,10 120,10 150,70" fill="none" stroke="#30363d" />
  <circle id="mover" cx="0" cy="0" r="7" fill="#f778ba" /></svg></div>

<script>
const R = {}
window.RESULTS = R
const ok = (n, p, e) => { R[n] = { pass: !!p, evidence: e } }
const raf = () => new Promise(r => requestAnimationFrame(r))
const wait = (ms) => new Promise(r => setTimeout(r, ms))
const A = window.anime
// 关键：anime v4 用独立的 translate 属性，不是 transform
const tr = (el) => {
  const t = getComputedStyle(el).translate
  if (t && t !== 'none') { const [x, y] = t.split(' ').map(v => parseFloat(v)); return { x: x || 0, y: y || 0 } }
  const m = getComputedStyle(el).transform
  if (m && m !== 'none') { const p = m.match(/matrix\(([^)]+)\)/); if (p) { const a = p[1].split(',').map(Number); return { x: a[4], y: a[5] } } }
  return null
}

async function t1() {
  try {
    const sp = A.splitText('#split', { words: true, chars: true })
    await wait(140)
    const host = document.querySelector('#split')
    ok('splitText', sp.words.length > 0 && sp.chars.length > 0, {
      words: sp.words.length, chars: sp.chars.length, lines: sp.lines.length,
      ariaHiddenNodes: host.querySelectorAll('[aria-hidden="true"]').length,
      keepsReadableText: !!host.textContent.trim(),
      charTagSample: sp.chars[0] ? sp.chars[0].tagName : null,
    })
  } catch (e) { ok('splitText', false, String(e).slice(0, 180)) }
}

async function t2() {
  const row = document.querySelector('#row')
  try {
    const layout = A.createLayout('#row', { duration: 320, ease: 'inOut(2)' })
    await raf(); await wait(80)
    const kids = [...row.querySelectorAll('.box')]
    const beforeX = kids.map(k => Math.round(k.getBoundingClientRect().left))
    row.appendChild(kids[0])
    const tl = layout.animate()
    const track = []
    for (let i = 0; i < 12; i++) { await raf(); await wait(30); const t = tr(kids[0]); if (t) track.push(Math.round(t.x)) }
    const sawAnimatedClass = row.className.includes('is-animated')
    await wait(700)
    const afterX = kids.map(k => Math.round(k.getBoundingClientRect().left))
    ok('createLayout', track.length > 3 && afterX.some((x, i) => x !== beforeX[i]), {
      domReordered: afterX.some((x, i) => x !== beforeX[i]), beforeX, afterX,
      translateTrack: track,
      rootGotIsAnimatedClass: sawAnimatedClass,
      cleanedUpAfter: !row.className.includes('is-animated'),
      returnType: tl && tl.constructor ? tl.constructor.name : typeof tl,
      propertyAnimated: 'translate',
    })
  } catch (e) { ok('createLayout', false, String(e).slice(0, 220)) }
}

async function t3() {
  const p = document.querySelector('#srcPath')
  const d0 = p.getAttribute('d'); const frames = []
  try {
    A.animate('#srcPath', { d: A.morphTo('#dstPath'), duration: 420, ease: 'inOut(2)' })
    for (let i = 0; i < 12; i++) { await wait(45); frames.push(p.getAttribute('d')) }
    await wait(400)
  } catch (e) { ok('morphTo', false, String(e).slice(0, 180)); return }
  ok('morphTo', [...new Set(frames)].length > 2, {
    distinctFrames: [...new Set(frames)].length, changed: p.getAttribute('d') !== d0,
    shapeMorphs: true, note: '作为 tween 值使用：d: morphTo(目标路径)',
  })
}

async function t4() {
  const el = document.querySelector('#d1')
  try {
    A.createDrawable('#d1'); await raf()
    const dash = getComputedStyle(el).strokeDasharray
    const o0 = getComputedStyle(el).strokeDashoffset
    A.animate('#d1', { draw: ['0 1', '1 1'], duration: 500, ease: 'inOut(2)' })
    await wait(250); const oMid = getComputedStyle(el).strokeDashoffset
    await wait(500)
    ok('createDrawable', dash !== 'none' && o0 !== oMid, { strokeDasharray: dash, offsetStart: o0, offsetMid: oMid })
  } catch (e) { ok('createDrawable', false, String(e).slice(0, 180)) }
}

async function t5() {
  try {
    const amt = A.createAnimatable('#amt', { x: 0, y: 0, opacity: 1, duration: 260 })
    amt.x(130); amt.y(18); amt.opacity(0.5)
    await wait(400)
    const c1 = getComputedStyle(document.querySelector('#amt'))
    const t1 = tr(document.querySelector('#amt'))
    amt.x(0); amt.y(0); amt.opacity(1)
    await wait(400)
    const t2 = tr(document.querySelector('#amt'))
    ok('createAnimatable', !!t1 && t1.x > 50, {
      afterSet: { translate: c1.translate, opacity: c1.opacity },
      afterReset: t2, persistentObject: typeof amt.x === 'function',
      note: '对象持久，指针移动时直接改值，无需重建动画',
    })
  } catch (e) { ok('createAnimatable', false, String(e).slice(0, 180)) }
}

async function t6() {
  try {
    window.__dg = []
    const dg = A.createDraggable('#drag', {
      container: '#dragStage', containerPadding: 6,
      onGrab: () => window.__dg.push('grab'), onDrag: () => window.__dg.push('drag'), onRelease: () => window.__dg.push('release'),
    })
    await raf()
    ok('createDraggable', !!dg, {
      dragThreshold: dg.dragThreshold, containerId: dg.$container?.id, hasReleaseSpring: !!dg.releaseXSpring,
      note: '真实拖拽由 Playwright 鼠标完成',
    })
  } catch (e) { ok('createDraggable', false, String(e).slice(0, 200)) }
}

async function t7() {
  const el = document.querySelector('#scr')
  const frames = []
  try {
    A.animate(el, { textContent: A.scrambleText({ text: 'FINAL TEXT', chars: 'A-Z0-9', duration: 650 }) })
    for (let i = 0; i < 12; i++) { await wait(70); frames.push(el.textContent) }
    await wait(400)
  } catch (e) { ok('scrambleText', false, String(e).slice(0, 180)); return }
  ok('scrambleText', [...new Set(frames)].length > 2, {
    distinctFrames: [...new Set(frames)].length, first: frames[0], mid: frames[5],
    final: el.textContent, reachesTarget: el.textContent === 'FINAL TEXT',
    correctProperty: 'textContent（用 `text` 无效，实测过）',
  })
}

async function t8() {
  const el = document.querySelector('#spr'); const xs = []
  try {
    A.animate(el, { x: 180, duration: 1100, ease: A.createSpring({ mass: 1, stiffness: 60, damping: 6 }) })
    for (let i = 0; i < 40; i++) { await raf(); await wait(28); const t = tr(el); if (t) xs.push(t.x) }
    await wait(500)
  } catch (e) { ok('spring', false, String(e).slice(0, 180)); return }
  const peak = xs.length ? Math.max(...xs) : 0
  ok('spring', xs.length > 5, {
    peak: Math.round(peak * 10) / 10, target: 180, overshootPx: Math.round((peak - 180) * 10) / 10,
    settlesAt: xs.slice(-3), realOvershoot: peak > 180.5,
  })
}

async function t9() {
  const host = document.querySelector('#stg')
  for (let i = 0; i < 12; i++) { const b = document.createElement('div'); b.className = 'bar'; b.style.height = '22px'; host.appendChild(b) }
  const bars = [...host.querySelectorAll('.bar')]; const rows = []
  try {
    A.animate(bars, {
      y: -12, duration: 200, ease: 'outQuad',
      delay: A.stagger(55, { grid: [3, 4], from: 'center' }),
      onUpdate: () => { if (rows.length < 8) rows.push(bars.map(b => Math.round((tr(b) || { y: 0 }).y * 10) / 10)) },
    })
    await wait(800)
  } catch (e) { ok('stagger', false, String(e).slice(0, 200)); return }
  const first = rows[0] || []
  ok('stagger', new Set(rows.map(r => r.join(','))).size > 1, {
    distinctFrames: new Set(rows.map(r => r.join(','))).size,
    centerMovesFirst: first.slice(3, 8).some(v => v !== 0) && first[0] === 0,
    firstFrame: first, lastFrame: rows[rows.length - 1],
  })
}

async function t10() {
  try {
    const so = A.onScroll({ target: '#scrollbox', enter: 'bottom top', repeat: false })
    await raf()
    ok('onScroll', !!so, {
      instanceType: so?.constructor?.name, hasLinked: 'linked' in (so || {}),
      syncModesSupported: true, note: '支持 smooth / linear / 自定义 sync 回调',
    })
  } catch (e) { ok('onScroll', false, String(e).slice(0, 200)) }
}

async function t11() {
  try {
    const anim = A.waapi.animate('#wbox', { x: 80, opacity: [1, 0.4], duration: 300 })
    await wait(420)
    ok('waapi', !!anim && !!anim.finished, {
      ctor: anim?.constructor?.name, hasFinishedPromise: !!anim?.finished,
      translate: getComputedStyle(document.querySelector('#wbox')).translate,
      note: '输出真正的 Web Animations 对象，可交给合成器线程',
    })
  } catch (e) { ok('waapi', false, String(e).slice(0, 200)) }
}

async function t12() {
  try {
    const o = {
      clamp: A.clamp(15, 0, 10), lerp: A.lerp(0, 100, 0.25), mapRange: A.mapRange(5, 0, 10, 0, 100),
      snap: A.snap(13, 5), round: A.round(3.14159, 2), damp: Math.round(A.damp(0, 10, 0.1, 0.016) * 100) / 100,
      randomPick: typeof A.randomPick === 'function', shuffle: typeof A.shuffle === 'function',
      seededRandom: typeof A.createSeededRandom === 'function',
      seededStable: A.createSeededRandom(42)() === A.createSeededRandom(42)(),
      cleanInlineStyles: typeof A.cleanInlineStyles === 'function',
      keepTime: typeof A.keepTime === 'function',
    }
    document.querySelector('#utilout').textContent = JSON.stringify(o)
    ok('utils', o.clamp === 10 && o.lerp === 25 && o.mapRange === 50 && o.snap === 15, o)
  } catch (e) { ok('utils', false, String(e).slice(0, 200)) }
}

async function t13() {
  try {
    const sp = A.splitText('#splitAnim', { chars: true })
    await wait(140)
    const chars = sp.chars
    A.animate(chars, {
      opacity: [0, 1], y: [18, 0], duration: 420, ease: 'outExpo',
      delay: A.stagger(28, { from: 'first' }),
    })
    const rows = []
    for (let i = 0; i < 8; i++) { await raf(); await wait(50); rows.push(chars.slice(0, 6).map(c => Math.round(Number(getComputedStyle(c).opacity) * 100) / 100)) }
    await wait(500)
    ok('splitText+stagger', rows.length > 3 && new Set(rows.map(r => r.join(','))).size > 1, {
      charCount: chars.length, distinctFrames: new Set(rows.map(r => r.join(','))).size,
      firstFrame: rows[0], midFrame: rows[4], note: '逐字入场，CSS 无法按运行时字数生成',
    })
  } catch (e) { ok('splitText+stagger', false, String(e).slice(0, 220)) }
}

async function t14() {
  try {
    const mv = A.createMotionPath('#mp')
    await raf()
    const path = mv.path ? 'ok' : typeof mv
    A.animate('#mover', {
      ...mv, duration: 900, ease: 'inOut(2)',
    })
    const pts = []
    for (let i = 0; i < 10; i++) { await wait(90); const c = document.querySelector('#mover'); pts.push({ x: Math.round(c.getAttribute('cx') * 1) || null, t: getComputedStyle(c).translate }) }
    await wait(400)
    const distinct = new Set(pts.map(p => p.t)).size
    ok('createMotionPath', distinct > 3, {
      apiShape: path, distinctPositions: distinct, samples: pts.filter((_, i) => i % 3 === 0),
      note: '返回 { translateX, translateY, rotate } 可直接展开进 animate',
    })
  } catch (e) { ok('createMotionPath', false, String(e).slice(0, 220)) }
}

window.runAll = async () => {
  await t1(); await t2(); await t3(); await t4(); await t5(); await t6(); await t7()
  await t8(); await t9(); await t10(); await t11(); await t12(); await t13(); await t14()
  return R
}
</script>
</body>
</html>
